<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">dashboard</ion-title>
    </ion-toolbar>
  </ion-header>

  <section class="dashboard-content">
    <div class="dashboard-time">
      <div class="dashboard-greet">
        <h1>Good Afternoon, {{ user?.full_name }}</h1>
        <h3>Here's your financial for October 2026</h3>
      </div>
    </div>
    <div class="dashboard-quick-report">
      <div class="total-balance-container">
        <div class="total-balance-icon"></div>
        <div class="total-balance-content">
          <p>Total Balance</p>
          <h1>P{{ totalBalance | number:'1.2-2' }}</h1>
          <p><span>12%</span>from last month</p>
        </div>
      </div>
    </div>
  </section>
</ion-content>
